# Release: push a tag that matches default/app.conf, e.g.
#   git tag v1.1.1 && git push origin v1.1.1
# Builds the Splunkbase package, runs the checks, and publishes a GitHub release with the
# package, SHA256SUMS and the AppInspect report. Upload the package to Splunkbase yourself.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: pip install -q -r ci/requirements.txt

      - name: Lint and tests
        run: |
          bash ci/lint.sh
          if [ -d tests ]; then python -m unittest discover -s tests; fi

      - name: Build package
        run: bash ci/build.sh

      - name: Tag matches the app version
        run: |
          . dist/package.env
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.conf version $VERSION"; exit 1; fi

      - name: Splunk AppInspect and SLIM
        run: bash ci/check.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . dist/package.env
          bash ci/release_notes.sh > dist/RELEASE_NOTES.md
          gh release create "$GITHUB_REF_NAME" "$PKG" dist/SHA256SUMS dist/appinspect.json \
            --title "$APP $VERSION" --notes-file dist/RELEASE_NOTES.md --verify-tag
